  :root[data-theme="dark"]{
    --ink:#e9f3f1;
    --paper:#0c1614;
    --surface:#132522;
    --surface-2:#193330;
    --line:#254440;
    --muted:#93aba7;
    --accent:#3fbdc9;
    --accent-deep:#8fe1e6;
    --accent-soft:rgba(63,189,201,.14);
    --good:#4fbd83;
    --good-soft:rgba(79,189,131,.14);
    --warn:#e0a53a;
    --warn-soft:rgba(224,165,58,.14);
    --bad:#e2726b;
    --bad-soft:rgba(226,114,107,.14);
    --sci:#b79ae0;

    --manometro:#7fb3e8;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15px;
    font-weight:500;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", ui-serif, Georgia, serif;
    text-wrap:balance;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono, .num, input[type="number"], .stat-value, .gauge-value, .table-num{
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric: tabular-nums;
  }
  button{font-family:inherit;}
  a{color:var(--accent-deep);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app-shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:236px;
    flex:0 0 236px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-line);
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    gap:18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
  .brand svg{flex:none; color:var(--sidebar-active-bg);}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text strong{font-family:"Fraunces",serif; font-size:16.5px; font-weight:600; color:var(--sidebar-text);}
  .brand-text span{font-size:11.5px; color:var(--sidebar-muted); letter-spacing:.02em;}

  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--sidebar-muted); padding:8px 10px 4px;}
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:8px;
    border:none; background:transparent; color:var(--sidebar-text);
    font-size:13.5px; text-align:left; cursor:pointer;
    width:100%;
  }
  .nav-btn svg{flex:none; color:var(--sidebar-muted); width:16px; height:16px;}
  .nav-btn:hover{background:var(--sidebar-hover);}
  .nav-btn.active{background:var(--sidebar-active-bg); color:var(--sidebar-active-text); font-weight:700;}
  .nav-btn.active svg{color:var(--sidebar-active-text);}
  .nav-dot{width:6px; height:6px; border-radius:50%; background:var(--sidebar-line); flex:none;}
  .nav-dot.has-data{background:var(--sidebar-active-bg);}

  .sync-banner{
    margin-top:auto;
    font-size:11.5px;
    color:var(--sidebar-muted);
    background:var(--sidebar-hover);
    border-radius:8px;
    padding:9px 10px;
    display:flex;
    gap:7px;
    align-items:flex-start;
  }
  .sync-banner svg{flex:none; margin-top:1px; color:var(--sidebar-muted);}
  .sync-banner.ok{color:var(--sidebar-good);}
  .sync-banner.ok svg{color:var(--sidebar-good);}
  .sync-banner.bad{color:var(--sidebar-warn);}
  .sync-banner.bad svg{color:var(--sidebar-warn);}

  /* ---------- Main ---------- */
  #main{flex:1 1 auto; min-width:0; padding:26px 30px 60px;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-head h1{font-size:26px; font-weight:600;}
  .page-sub{color:var(--muted); font-size:13.5px; margin-top:4px;}
  .head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .period-toggle{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px;}
  .period-toggle button{
    border:none; background:transparent; padding:6px 13px; border-radius:7px;
    font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .period-toggle button.active{background:var(--surface); color:var(--accent-deep); box-shadow:var(--shadow);}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border-radius:8px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:12.5px; font-weight:600; padding:8px 13px; cursor:pointer;
  }
  .btn svg{width:14px; height:14px;}
  .btn:hover{border-color:var(--accent); color:var(--accent-deep);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff;}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--surface-2); border-color:transparent;}
  .btn-danger{color:var(--bad);}
  .btn-danger:hover{border-color:var(--bad); color:var(--bad);}
  .btn-sm{padding:5px 9px; font-size:11.5px;}
  .icon-btn{padding:6px; border-radius:7px;}

  .grid{display:grid; gap:16px;}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid-2-1{grid-template-columns:2fr 1fr;}
  @media (max-width: 980px){ .grid-2, .grid-2-1{grid-template-columns:1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); border-top:3px solid var(--line);
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .card-title{font-size:14px; font-weight:700; display:flex; align-items:center;}
  .card-title .unit{color:var(--muted); font-weight:600; font-size:11.5px;}
  .metric-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; flex:none; box-shadow:0 0 0 3px var(--surface-2);}
  .section-head{display:flex; align-items:baseline; gap:10px; margin:26px 0 4px;}
  .section-head h2{font-size:16px; font-weight:700; margin:0;}
  .section-head .page-sub{margin:0;}
  .legend-row{display:flex; flex-wrap:wrap; gap:14px; margin:2px 0 14px;}
  .legend-chip{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600;}
  .legend-chip .metric-dot{margin-right:0;}

  .stat-value{font-size:32px; font-weight:600; line-height:1;}
  .stat-label{color:var(--muted); font-size:12px; margin-top:6px;}
  .stat-delta{font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:99px; display:inline-block; margin-top:8px;}
  .stat-delta.good{background:var(--good-soft); color:var(--good);}
  .stat-delta.warn{background:var(--warn-soft); color:var(--warn);}
  .stat-delta.bad{background:var(--bad-soft); color:var(--bad);}

  .chip{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em;}
  .chip.good{background:var(--good-soft); color:var(--good);}
  .chip.warn{background:var(--warn-soft); color:var(--warn);}
  .chip.bad{background:var(--bad-soft); color:var(--bad);}
  .chip.neutral{background:var(--surface-2); color:var(--muted);}

  /* ---------- Form ---------- */
  .form-card{padding:22px;}
  .form-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  @media (max-width:820px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.span-2{grid-column:span 2;}
  .field.span-3{grid-column:1/-1;}
  @media (max-width:820px){.field.span-2{grid-column:span 2;}}
  @media (max-width:560px){.field.span-2, .field.span-3{grid-column:1/-1;}}

  label .req{color:var(--bad);}
  input, select, textarea{
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);

  textarea{resize:vertical; min-height:64px;}

    padding:9px 11px; font-size:15px; font-weight:600; color:var(--accent-deep);

  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; align-items:center;}

    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px;
  }

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
  table{width:100%; border-collapse:collapse; font-size:12.75px; font-weight:600; min-width:760px;}
  thead th{
    text-align:left; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2);
    position:sticky; top:0;

  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; font-weight:600;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.obs-cell{white-space:normal; max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  .row-actions{display:flex; gap:4px;}
  .table-wrap input[type="date"], .table-wrap input[type="number"], .table-wrap input[type="text"]{

  .table-wrap input[type="text"]{min-width:140px;}
  .empty-row td{color:var(--muted); text-align:center; padding:26px 12px;}
  .obs-flag{color:var(--warn); display:inline-flex; vertical-align:-3px; cursor:pointer;}

  /* ---------- Charts ---------- */
  .chart-wrap{width:100%; overflow-x:auto;}
  .bar-obs{cursor:pointer;}
  .bar-obs:hover{opacity:.8;}
  .axis-label{font-size:9.5px; fill:var(--muted); font-family:"IBM Plex Mono", monospace;}
  .grid-line{stroke:var(--line); stroke-width:1;}
  .bar-empty{fill:var(--surface-2);}

  .gauge-card{display:flex; flex-direction:column; align-items:center; text-align:center;}
  .gauge-value{font-size:30px; font-weight:600; margin-top:-8px;}
  .gauge-avg{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .gauge-status{margin-top:8px;}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:600;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(6px);
    transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--bad);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(12,20,18,.5); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; z-index:90; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:14px; border:1px solid var(--line); box-shadow:var(--shadow);
    width:100%; max-width:480px; max-height:86vh; overflow-y:auto; padding:22px;
  }
  .modal.wide{max-width:600px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .modal-head h3{font-size:18px;}
  .modal-close{border:none; background:var(--surface-2); border-radius:8px; padding:6px; cursor:pointer; color:var(--muted);}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; font-size:13px;}
  .detail-grid dt{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}
  .detail-grid dd{margin:0; font-weight:600;}
  .detail-grid .full{grid-column:1/-1;}
  .detail-obs{background:var(--surface-2); border-radius:8px; padding:10px 12px; font-size:13px; margin-top:4px; white-space:pre-wrap;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}

  .readonly-note{font-size:12px; color:var(--muted);}

  /* ---------- Print ---------- */
  #print-area{display:none;}
  @media print{
    #sidebar, .no-print{display:none !important;}
    #main{padding:0; max-width:none;}
    body.print-mode-record #main > *:not(#print-area){display:none !important;}
    body.print-mode-record #print-area{display:block !important;}
    body.print-mode-dashboard .page-head .head-actions{display:none !important;}
    body{background:#fff; color:#000;}
    .card{box-shadow:none; border:1px solid #ccc; break-inside:avoid;}
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>

/* Registro diario siempre muestra las 4 lecturas (macro, bombas, manómetro, SCI) para
   cualquier Piazza, y ninguna es obligatoria salvo macro + SCI — así cada Piazza puede
   usar solo los campos que le apliquen. En el dashboard, en cambio, una tarjeta/gráfico
   de bombas o manómetro solo se muestra si esa Piazza tiene al menos un dato histórico
   real para ese campo (detección automática, no una lista fija de Piazzas). */
function hasManometro(piazza){
  return recordsForPiazza(piazza).some(function(r){ return r.presionManometro!=null && !isNaN(r.presionManometro); });
}
function hasSegundoMedidor(piazza){
  return recordsForPiazza(piazza).some(function(r){ return r.bombasLectura!=null && !isNaN(r.bombasLectura); });
}
/* El campo "bombasLectura" es genéricamente el segundo medidor de la Piazza; en FCG
   ese segundo medidor es específicamente el de Supermaxi, y en Ceibos es el de
   Servicios Generales, así que a cada una se le muestra su propio nombre en toda
   la interfaz en vez del genérico "Cuarto de bombas". */
function segundoMedidorNombre(piazza){
  if(piazza === 'FCG') return 'Medidor de Supermaxi';
  if(piazza === 'Ceibos') return 'Medidor de Servicios Generales';
  return 'Cuarto de bombas';
}
function segundoMedidorFrase(piazza){
  if(piazza === 'FCG') return 'medidor de Supermaxi';
  if(piazza === 'Ceibos') return 'medidor de servicios generales';
  return 'cuarto de bombas';
}
function segundoMedidorCorto(piazza){
  if(piazza === 'FCG') return 'Supermaxi';
  if(piazza === 'Ceibos') return 'Serv. Generales';
  return 'bombas';
}

};

/* ============================= STATE ============================= */

function defaultState(){
  return { version:1, records:[] };
}

var rawStateEl = document.getElementById('app-state');
var state;
try{
  var txt = rawStateEl.textContent.trim();
  state = (txt && txt !== '__STATE_JSON__') ? JSON.parse(txt) : defaultState();
}catch(e){ state = defaultState(); }
if(!state || !Array.isArray(state.records)) state = defaultState();

/* local (per-viewer, not persisted) UI state */
var ui = {
  view: 'registro',            // 'registro' | piazza name
  period: 'dia',                // dia | semana | mes — dashboard de Piazza siempre arranca en "Día"
  periodAnchor: null,           // null = ventana más reciente ("Hoy"); si no, fecha ISO elegida con ‹ › o el calendario
  selectedPiazza: PIAZZAS[0],  // piazza shown in the Registro diario sheet
  selectedMonth: null,         // 'YYYY-MM' shown in the Registro diario sheet (set on first render)
  writable: null,               // null=unknown, true/false once known
  saving: false
};

/* If a publish-triggered reload just happened while the viewer had unsaved cells in the
   Registro diario grid, land back on that same piazza + month so the restore below finds it. */
(function(){
  try{
    var raw = sessionStorage.getItem('registroDraft');
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.piazza && d.month){ ui.view = 'registro'; ui.selectedPiazza = d.piazza; ui.selectedMonth = d.month; }
    }
  }catch(e){}
})();

/* ============================= HELPERS ============================= */

function uid(){ return 'r-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtNum(n, dec){ if(n==null || isNaN(n)) return '—'; dec = dec==null?1:dec; return Number(n).toLocaleString('es-EC',{minimumFractionDigits:0, maximumFractionDigits:dec}); }
function fmtDate(iso){ if(!iso) return '—'; var d = parseISODate(iso); return d.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}); }
function parseISODate(iso){ var p = iso.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoWeekKey(iso){
  var d = parseISODate(iso);
  var dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  var week = 1 + Math.round(((dt - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return dt.getUTCFullYear() + '-S' + String(week).padStart(2,'0');
}
function monthKey(iso){ return iso.slice(0,7); }
function weekLabel(key){ return key.replace('-S','  ·  Sem. '); }
function monthLabel(key){
  var p = key.split('-'); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1);
  return d.toLocaleDateString('es-EC',{month:'short',year:'2-digit'});
}
function dayLabel(iso){ var d = parseISODate(iso); return d.toLocaleDateString('es-EC',{day:'2-digit',month:'short'}); }
function addDays(iso, n){ var d = parseISODate(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function recordsForPiazza(p){ return state.records.filter(function(r){ return r.piazza === p; }); }

function sortedAll(){
  return state.records.slice().sort(function(a,b){
    if(a.fecha !== b.fecha) return a.fecha < b.fecha ? 1 : -1;
    return (b.updatedAt||'') < (a.updatedAt||'') ? -1 : 1;
  });
}

/* Build buckets of {key,label,rangeStart,rangeEnd} for period, ending at `anchor` (default: today) */
function buildBuckets(period, count, anchor){
  var buckets = [];
  var today = anchor || todayISO();
  if(period === 'dia'){
    for(var i=count-1;i>=0;i--){ var iso = addDays(today, -i); buckets.push({key:iso, label:dayLabel(iso), type:'dia'}); }
  } else if(period === 'semana'){
    var seen = {};
    var keys = [];
    for(var w=0; w<count*7; w+=7){ var iso2 = addDays(today, -w); var k = isoWeekKey(iso2); if(!seen[k]){ seen[k]=true; keys.push(k); } }
    keys.reverse();
    keys.forEach(function(k){ buckets.push({key:k, label:k.split('-S')[1] ? 'S'+k.split('-S')[1] : k, type:'semana'}); });
  } else { // mes
    var anchorDate = parseISODate(today);
    for(var m=count-1;m>=0;m--){
      var d = new Date(anchorDate.getFullYear(), anchorDate.getMonth()-m, 1);
      var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      buckets.push({key:key, label:monthLabel(key), type:'mes'});
    }
  }
  return buckets;
}

function bucketKeyForRecord(r, period){
  if(period==='dia') return r.fecha;
  if(period==='semana') return isoWeekKey(r.fecha);
  return monthKey(r.fecha);
}

/* Aggregate a metric per bucket: {key,label} -> {value(avg), sum, count, obsRecords:[]} */
function aggregate(records, period, count, metricFn, anchor){
  var buckets = buildBuckets(period, count, anchor);
  var map = {};
  buckets.forEach(function(b){ map[b.key] = {sum:0,count:0,obs:[]}; });
  records.forEach(function(r){
    var k = bucketKeyForRecord(r, period);
    if(!map[k]) return;
    var v = metricFn(r);
    if(v!=null && !isNaN(v)){ map[k].sum += v; map[k].count++; }
    if(r.observacion && r.observacion.trim()){ map[k].obs.push(r); }
  });
  return buckets.map(function(b){
    var m = map[b.key];
    return { key:b.key, label:b.label, value: m.count? m.sum/m.count : null, sum: m.sum, count:m.count, obs:m.obs };
  });
}

function average(list){
  var vals = list.filter(function(v){ return v!=null && !isNaN(v); });
  if(!vals.length) return null;
  return vals.reduce(function(a,b){return a+b;},0) / vals.length;
}

/* Given records of ONE piazza, return them ascending by fecha with macroConsumo/
   bombasConsumo computed as the delta vs. the previous chronological lectura. */
function metersSeries(records){
  var sorted = records.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0); });
  var prevMacro = null, prevBombas = null;
  return sorted.map(function(r){
    var macroL = (r.macroLectura!=null && !isNaN(r.macroLectura)) ? Number(r.macroLectura) : null;
    var bombasL = (r.bombasLectura!=null && !isNaN(r.bombasLectura)) ? Number(r.bombasLectura) : null;
    var macroC = (macroL!=null && prevMacro!=null) ? (macroL - prevMacro) : null;
    var bombasC = (bombasL!=null && prevBombas!=null) ? (bombasL - prevBombas) : null;
    if(macroL!=null) prevMacro = macroL;
    if(bombasL!=null) prevBombas = bombasL;
    return Object.assign({}, r, { macroConsumo: macroC, bombasConsumo: bombasC });
  });
}

function consumoForRecord(r){
  var series = metersSeries(recordsForPiazza(r.piazza));
  var found = series.find(function(x){ return x.id === r.id; });
  return found ? { macroConsumo: found.macroConsumo, bombasConsumo: found.bombasConsumo } : { macroConsumo:null, bombasConsumo:null };
}

/* Most recent lectura for piazza+field strictly before `beforeFecha`, excluding excludeId. */
function previousLectura(records, piazza, beforeFecha, field, excludeId){
  var list = records.filter(function(r){
    return r.piazza===piazza && r.fecha < beforeFecha && r.id!==excludeId && r[field]!=null && !isNaN(r[field]);
  });
  if(!list.length) return null;
  list.sort(function(a,b){ return a.fecha < b.fecha ? 1 : -1; });
  return Number(list[0][field]);
}

/* Create or update the single record for (piazza, fecha). If a different record already
   occupies that date, it absorbs the new data; if `excludeId` pointed at another record
   (editing + date changed), the stale one is removed. */
function upsertByPiazzaFecha(piazza, fecha, data, excludeId){
  var existing = state.records.find(function(r){ return r.piazza===piazza && r.fecha===fecha && r.id!==excludeId; });
  var now = new Date().toISOString();
  var result = null;
  if(existing){
    Object.assign(existing, data, { updatedAt: now });
    if(excludeId){ state.records = state.records.filter(function(r){ return r.id===existing.id || r.id!==excludeId; }); }
    result = existing;
  } else if(excludeId){
    var idx = state.records.findIndex(function(r){ return r.id===excludeId; });
    if(idx > -1){
      state.records[idx] = Object.assign({}, state.records[idx], data, { fecha:fecha, piazza:piazza, updatedAt: now });
      result = state.records[idx];
    }
  } else {
    var rec = Object.assign({ id: uid(), createdAt: now }, data, { fecha:fecha, piazza:piazza, updatedAt: now });
    state.records.push(rec);
    result = rec;
  }
  return result;
}

/* ============================= PERSISTENCE ============================= */

/* syncMode: 'firestore' (deployed on Firebase Hosting, shared cloud DB) |
   'artifact' (running inside a Claude Artifact) | 'none' (no backend reachable) */
var syncMode = 'none';
var artifactApi = null;
var db = null;
var FIRESTORE_COLLECTION = 'records';

var syncReady = (async function(){
  try{
    if(window.firebase && typeof firebase.firestore === 'function'){
      // /__/firebase/init.js (served only from actual Firebase Hosting) auto-initializes the app.
      if(!firebase.apps || !firebase.apps.length){ throw new Error('no-firebase-app'); }
      db = firebase.firestore();
      await seedFirestoreIfEmpty();
      attachFirestoreListener();
      syncMode = 'firestore';
      updateSyncBanner();
      return;
    }
  }catch(e){ db = null; }
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      artifactApi = await window.claude.use('artifact');
      if(artifactApi) syncMode = 'artifact';
    }
  }catch(e){ artifactApi = null; }
  updateSyncBanner();
})();

/* First-ever deploy: the collection is empty but the page still carries the historical
   records embedded in <script id="app-state">. Push them once so Firestore becomes the
   source of truth from then on. Safe to call every load — no-ops once the collection has data. */
async function seedFirestoreIfEmpty(){
  var snap = await db.collection(FIRESTORE_COLLECTION).limit(1).get();
  if(!snap.empty) return;
  var records = state.records || [];
  for(var i=0;i<records.length;i+=450){
    var chunk = records.slice(i, i+450);
    var batch = db.batch();
    chunk.forEach(function(r){ batch.set(db.collection(FIRESTORE_COLLECTION).doc(r.id), r); });
    await batch.commit();
  }
}

/* Keeps every open viewer in sync in real time: any teammate's save updates everyone's screen. */
function attachFirestoreListener(){
  db.collection(FIRESTORE_COLLECTION).onSnapshot(function(snap){
    var recs = [];
    snap.forEach(function(doc){ recs.push(doc.data()); });
    state.records = recs;
    ui.writable = true;
    if(document.getElementById('sidebar')){ renderAll(); }
    updateSyncBanner();
  }, function(err){
    ui.writable = false;
    updateSyncBanner();
  });
}

function updateSyncBanner(){
  var el = document.getElementById('sync-banner');
  if(!el) return;
  if(ui.saving){
    el.className = 'sync-banner'; el.innerHTML = ICONS.cloud + '<span>Guardando cambios…</span>'; return;
  }
  if(syncMode === 'none'){
    el.className = 'sync-banner bad';
    el.innerHTML = ICONS.warnTri + '<span>Sin conexión de guardado — los cambios sólo viven en esta vista.</span>';
  } else if(ui.writable === false){
    el.className = 'sync-banner bad';
    el.innerHTML = ICONS.warnTri + '<span>Vista de solo lectura — no se pueden guardar cambios.</span>';
  } else {
    el.className = 'sync-banner ok';
    el.innerHTML = ICONS.cloud + '<span>Los cambios se guardan para todo el equipo.</span>';
  }
}

/* delta: { upserts: [record, ...], deletes: [id, ...] } — the records changed by this
   action. Only used by the Firestore path (record-level writes); the Artifact path still
   republishes the whole page since that's the only API it offers. */
async function persist(delta){
  ui.saving = true; updateSyncBanner();
  stashRegistroDraftIfNeeded();
  try{
    if(syncMode === 'none'){ await syncReady; }
    if(syncMode === 'firestore'){
      var batch = db.batch();
      (delta && delta.upserts || []).forEach(function(r){
        batch.set(db.collection(FIRESTORE_COLLECTION).doc(r.id), r);
      });
      (delta && delta.deletes || []).forEach(function(id){
        batch.delete(db.collection(FIRESTORE_COLLECTION).doc(id));
      });
      await batch.commit();
      ui.saving = false; updateSyncBanner();
      // attachFirestoreListener's onSnapshot will re-render with the confirmed data.
      return;
    }
    if(syncMode !== 'artifact'){
      ui.saving = false; updateSyncBanner();
      toast('No hay guardado disponible aquí — cambio aplicado sólo en esta vista.', true);
      return;
    }
    var src = await fetch(location.href, {cache:'no-store'}).then(function(r){ return r.text(); });
    var jsonStr = JSON.stringify(state).replace(/</g, '\\u003c');
    var newSrc = src.replace(
      /<script id="app-state" type="application\/json">[\s\S]*?<\/script>/,
      '<script id="app-state" type="application/json">' + jsonStr + '<\/script>'
    );
    await artifactApi.publish(newSrc);
    // A successful whole-page publish reloads this view automatically.
  }catch(err){
    ui.saving = false;
    if(syncMode === 'firestore'){
      updateSyncBanner();
      toast('No se pudo guardar en la nube. Revisa tu conexión.', true);
      return;
    }
    var code = err && err.code;
    if(code === 'not_writer' || code === 'not_granted'){
      ui.writable = false; updateSyncBanner();
      toast('Vista de solo lectura: no se pudo guardar.', true);
    } else if(code === 'conflict'){
      toast('Alguien más actualizó los datos — recargando…');
    } else {
      updateSyncBanner();
      toast('No se pudo guardar. Intenta de nuevo.', true);
    }
  }
}

/* ============================= TOAST ============================= */

function toast(msg, isError){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 250); }, 3200);
}

function deleteRecord(id){
  state.records = state.records.filter(function(r){ return r.id !== id; });
  renderMain();
  persist({ deletes: [id] });
  toast('Registro eliminado.');
}

function startEdit(id){

/* ============================= CHARTS: BAR ============================= */

function renderBarChart(container, buckets, opts){
  opts = opts || {};
  var W = Math.max(container.clientWidth || 560, buckets.length * 46 + 40);
  var H = opts.height || 190;
  var padL = 38, padR = 12, padT = 14, padB = 26;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var maxVal = Math.max.apply(null, buckets.map(function(b){ return b.value||0; }).concat([opts.minMax||0]));
  if(maxVal <= 0) maxVal = 1;
  var niceMax = maxVal * 1.15;
  var bw = innerW / buckets.length;
  var barW = Math.min(bw * 0.56, 34);

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Gráfico de barras">';
  // gridlines (3)
  for(var g=0; g<=3; g++){
    var gy = padT + innerH - (innerH * g/3);
    svg += '<line class="grid-line" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/>';
    svg += '<text class="axis-label" x="4" y="'+(gy+3)+'">' + fmtNum(niceMax*g/3,0) + '</text>';
  }
  buckets.forEach(function(b, i){
    var cx = padL + bw*i + bw/2;
    var h = b.value!=null ? (b.value/niceMax)*innerH : 0;
    var y = padT + innerH - h;
    var fill = opts.color || 'var(--accent)';
    if(b.value==null){
      svg += '<rect class="bar-empty" x="'+(cx-barW/2)+'" y="'+(padT+innerH-2)+'" width="'+barW+'" height="2" rx="1"/>';
    } else {
      svg += '<rect x="'+(cx-barW/2)+'" y="'+y+'" width="'+barW+'" height="'+Math.max(h,2)+'" rx="3" fill="'+fill+'"><title>'+b.label+': '+fmtNum(b.value,2)+' '+(opts.unit||'m³')+'</title></rect>';
      var labelY = (b.obs && b.obs.length) ? (y-22) : (y-6);
      svg += '<text class="bar-value-label" x="'+cx+'" y="'+Math.max(labelY, padT+2)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--ink)">'+fmtNum(b.value,1)+'</text>';
    }
    if(b.obs && b.obs.length){
      svg += '<g class="bar-obs" data-obs-key="'+b.key+'" transform="translate('+cx+','+(y-11)+')" style="color:var(--warn)">' +
             '<circle r="7" fill="var(--warn-soft)"/><g transform="translate(-6.5,-6.5)">'+ICONS.note.replace('currentColor','var(--warn)')+'</g></g>';
    }
    svg += '<text class="axis-label" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+escapeHtml(b.label)+'</text>';
  });
  svg += '</svg>';
  container.innerHTML = '<div class="chart-wrap">' + svg + '</div>';

  container.querySelectorAll('.bar-obs').forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-obs-key');
      var b = buckets.find(function(x){ return x.key === key; });
      if(b) openObsModal(b.obs);
    });
  });
}

/* ============================= CHARTS: GAUGE ============================= */

function renderGauge(container, opts){
  var value = opts.value, avg = opts.avg, obs = opts.obs || [];
  var W = 220, H = 148, cx = W/2, cy = 122, r = 92;
  var domainMax = Math.max((avg||0) * 1.6, (value||0) * 1.2, 10);

  function angleFor(v){
    var t = Math.max(0, Math.min(1, v / domainMax));
    return Math.PI - t * Math.PI; // PI (left,180deg) -> 0 (right)
  }
  function pt(ang, rad){ return [cx + rad*Math.cos(ang), cy - rad*Math.sin(ang)]; }

  var status = 'good', statusLabel = 'Normal';
  if(avg != null && value != null){
    if(value > avg*1.25){ status='bad'; statusLabel='Muy por encima del promedio'; }
    else if(value > avg*1.10){ status='warn'; statusLabel='Sobre el promedio'; }
    else { status='good'; statusLabel='Dentro del promedio'; }
  } else { statusLabel = 'Sin datos suficientes'; status='neutral'; }

  var zones = avg!=null ? [
    {from:0, to:Math.min(avg*1.10, domainMax), color:'var(--good)'},
    {from:Math.min(avg*1.10, domainMax), to:Math.min(avg*1.25, domainMax), color:'var(--warn)'},
    {from:Math.min(avg*1.25, domainMax), to:domainMax, color:'var(--bad)'}
  ] : [{from:0,to:domainMax,color:'var(--line)'}];

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
  zones.forEach(function(z){
    if(z.to <= z.from) return;
    var a0 = angleFor(z.from), a1 = angleFor(z.to);
    var p0 = pt(a0, r), p1 = pt(a1, r);
    var largeArc = (a0 - a1) > Math.PI ? 1 : 0;
    svg += '<path d="M '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+largeArc+' 1 '+p1[0]+' '+p1[1]+'" stroke="'+z.color+'" stroke-width="13" fill="none" stroke-linecap="butt"/>';
  });
  // ticks
  [0,.25,.5,.75,1].forEach(function(t){
    var a = Math.PI - t*Math.PI;
    var p1 = pt(a, r+11), p2 = pt(a, r+3);
    svg += '<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="var(--muted)" stroke-width="1.4"/>';
  });
  // needle
  if(value != null){
    var na = angleFor(value);
    var np = pt(na, r-16);
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+np[0]+'" y2="'+np[1]+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="var(--ink)"/>';
  }
  // avg marker
  if(avg != null){
    var aa = angleFor(avg);
    var ap1 = pt(aa, r+8), ap2 = pt(aa, r-8);
    svg += '<line x1="'+ap1[0]+'" y1="'+ap1[1]+'" x2="'+ap2[0]+'" y2="'+ap2[1]+'" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="2 2" opacity=".5"/>';
  }
  if(obs.length){
    svg += '<g class="bar-obs" data-obs="1" transform="translate('+(W-20)+',16)" style="color:var(--warn)"><circle r="9" fill="var(--warn-soft)"/><g transform="translate(-6.5,-6.5)">'+ICONS.note.replace('currentColor','var(--warn)')+'</g></g>';
  }
  svg += '</svg>';

  container.innerHTML =
    '<div class="chart-wrap" style="display:flex; justify-content:center;">' + svg + '</div>' +
    '<div class="gauge-value mono" style="color:var(--'+(status==='neutral'?'ink':status)+')">' + (value!=null?fmtNum(value,1)+' <span style="font-size:14px; color:var(--muted); font-weight:500;">psi</span>':'—') + '</div>' +
    '<div class="gauge-avg">Promedio histórico: ' + (avg!=null?fmtNum(avg,1)+' psi':'—') + '</div>' +
    '<div class="gauge-status"><span class="chip ' + status + '">' + statusLabel + '</span></div>';

  if(obs.length){
    var flag = container.querySelector('[data-obs="1"]');
    if(flag) flag.addEventListener('click', function(){ openObsModal(obs); });
  }
}

/* ============================= RENDER: REGISTRO DIARIO (hoja de mes, tipo Excel) ============================= */

function daysInMonthArr(monthKey){
  var parts = monthKey.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  var last = new Date(y, m, 0).getDate();
  var arr = [];
  for(var d=1; d<=last; d++){ arr.push(monthKey + '-' + String(d).padStart(2,'0')); }
  return arr;
}

function dayRowLabel(fecha){
  var d = parseISODate(fecha);
  var wd = d.toLocaleDateString('es-EC',{weekday:'short'}).replace('.','');
  return '<span style="color:var(--muted); text-transform:capitalize;">' + wd + '</span> ' + d.getDate();
}

function consumoInnerHtml(v){
  if(v==null) return '—';
  if(v < 0) return '<span style="color:var(--bad); font-weight:600;" title="Revisar: la lectura es menor que la anterior">' + fmtNum(v,2) + ' ' + ICONS.warnTri + '</span>';
  return fmtNum(v,2);
}

function consumoCell(v){ return '<td class="mono table-num">' + consumoInnerHtml(v) + '</td>'; }

function numVal(id){
  var el = document.getElementById(id);
  if(!el || el.value==='') return null;
  var v = parseFloat(el.value);
  return isNaN(v) ? null : v;
}
function rawVal(id){ var el = document.getElementById(id); return el ? el.value : ''; }
function setInputIfEmpty(id, val){ var el = document.getElementById(id); if(el && el.value==='' && val){ el.value = val; } }
function setText(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; }

function renderRegistro(){
  var main = document.getElementById('main');
  if(!ui.selectedPiazza) ui.selectedPiazza = PIAZZAS[0];
  if(!ui.selectedMonth) ui.selectedMonth = todayISO().slice(0,7);
  var piazza = ui.selectedPiazza;
  var piazzaOptions = PIAZZAS.map(function(p){ return '<option value="'+escapeHtml(p)+'"'+(p===piazza?' selected':'')+'>'+escapeHtml(p)+'</option>'; }).join('');

  main.innerHTML =
    '<div class="page-head">' +
      '<div><h1>Registro diario</h1><p class="page-sub">Elige el mes y la Piazza, y llena la lectura de cada día — el consumo se calcula solo.</p></div>' +
      '<div class="head-actions">' +
        '<input type="month" id="month-select" class="btn" style="padding:8px 11px; font-weight:600;" value="' + ui.selectedMonth + '">' +
        '<select id="piazza-select" class="btn" style="padding:8px 11px; font-weight:600;">' + piazzaOptions + '</select>' +
        '<button class="btn btn-primary" id="save-month-btn">' + ICONS.plus + ' Guardar mes</button>' +
      '</div>' +
    '</div>' +
    '<div class="card" style="padding:0; overflow:hidden;"><div id="month-grid"></div></div>';

  document.getElementById('piazza-select').addEventListener('change', function(e){
    stashRegistroDraftIfNeeded(); // keep whatever was typed for the piazza we're leaving
    ui.selectedPiazza = e.target.value;
    renderMonthGrid();
  });
  document.getElementById('month-select').addEventListener('change', function(e){
    if(!e.target.value) return;
    stashRegistroDraftIfNeeded(); // keep whatever was typed for the month we're leaving
    ui.selectedMonth = e.target.value;
    renderMonthGrid();
  });
  document.getElementById('save-month-btn').addEventListener('click', saveMonthGrid);

  renderMonthGrid();
}

function renderMonthGrid(){
  var wrap = document.getElementById('month-grid');
  var piazza = ui.selectedPiazza, month = ui.selectedMonth;
  var days = daysInMonthArr(month);
  var records = recordsForPiazza(piazza);
  var byFecha = {};
  records.forEach(function(r){ byFecha[r.fecha] = r; });
  var seriesByFecha = {};
  metersSeries(records).forEach(function(s){ seriesByFecha[s.fecha] = s; });

  /* Registro diario siempre muestra los 4 campos, sin importar si la Piazza los usa
     históricamente — así el personal puede llenarlos si aplica. */
  var showMano = true;
  var showBombas = true;

  var rows = days.map(function(fecha){
    var rec = byFecha[fecha];
    var s = seriesByFecha[fecha];
    return '<tr data-day="' + fecha + '">' +
      '<td class="mono" style="white-space:nowrap;">' + dayRowLabel(fecha) + '</td>' +
      '<td><input type="number" step="0.01" id="m-macro-' + fecha + '" value="' + (rec && rec.macroLectura!=null ? rec.macroLectura : '') + '" placeholder="lectura"></td>' +
      '<td class="mono table-num" id="m-macro-consumo-' + fecha + '">' + consumoInnerHtml(s ? s.macroConsumo : null) + '</td>' +
      (showBombas ? ('<td><input type="number" step="0.01" id="m-bombas-' + fecha + '" value="' + (rec && rec.bombasLectura!=null ? rec.bombasLectura : '') + '" placeholder="lectura ' + segundoMedidorCorto(piazza) + '"></td>' +
      '<td class="mono table-num" id="m-bombas-consumo-' + fecha + '">' + consumoInnerHtml(s ? s.bombasConsumo : null) + '</td>') : '') +
      (showMano ? ('<td><input type="number" step="0.1" id="m-mano-' + fecha + '" value="' + (rec && rec.presionManometro!=null ? rec.presionManometro : '') + '" placeholder="psi"></td>') : '') +
      '<td><input type="number" step="0.1" id="m-sci-' + fecha + '" value="' + (rec && rec.presionSci!=null ? rec.presionSci : '') + '" placeholder="psi"></td>' +
      '<td><input type="text" id="m-obs-' + fecha + '" value="' + escapeHtml(rec ? (rec.observacion||'') : '') + '" placeholder="—"></td>' +
      '<td><div class="row-actions">' +
        (rec ? ('<button class="btn icon-btn btn-ghost" data-pdf="'+rec.id+'" title="Exportar PDF" aria-label="Exportar PDF">'+ICONS.download+'</button>' +
               '<button class="btn icon-btn btn-ghost btn-danger" data-del="'+rec.id+'" title="Eliminar" aria-label="Eliminar">'+ICONS.trash+'</button>') : '') +
      '</div></td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML =
    '<div class="table-wrap" style="border:none; border-radius:0;"><table><thead><tr>' +
      '<th>Día</th>' +
      '<th>Lectura macro (m³)</th><th>Consumo macro (m³)</th>' +
      (showBombas ? ('<th>Lectura ' + segundoMedidorCorto(piazza) + ' (m³)</th><th>Consumo ' + segundoMedidorCorto(piazza) + ' (m³)</th>') : '') +
      (showMano ? '<th>Manómetro (psi)</th>' : '') + '<th>SCI (psi)</th>' +
      '<th>Observación</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr style="background:var(--surface-2); font-weight:600;">' +
      '<td>Promedio del mes</td>' +
      '<td></td><td class="mono table-num" id="month-avg-macro">—</td>' +
      (showBombas ? '<td></td><td class="mono table-num" id="month-avg-bombas">—</td>' : '') +
      (showMano ? '<td class="mono table-num" id="month-avg-mano">—</td>' : '') +
      '<td class="mono table-num" id="month-avg-sci">—</td>' +
      '<td></td><td></td>' +
    '</tr></tfoot></table></div>';

  bindRowActions(wrap);
  days.forEach(function(fecha){
    var ids = ['m-macro-'+fecha];
    if(showBombas) ids.push('m-bombas-'+fecha);
    if(showMano) ids.push('m-mano-'+fecha);
    ids.push('m-sci-'+fecha);
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.addEventListener('input', function(){ recomputeMonthGrid(piazza, days); });
    });
  });

  restoreRegistroDraftIfAny();
  recomputeMonthGrid(piazza, days);
}

/* Recomputes consumo cells + the monthly averages from what's currently typed in the
   grid (without touching the <input> elements themselves, so focus is never lost). */
function recomputeMonthGrid(piazza, days){
  var saved = recordsForPiazza(piazza);
  var merged = {};
  saved.forEach(function(r){ merged[r.fecha] = { fecha:r.fecha, macroLectura:r.macroLectura, bombasLectura:r.bombasLectura }; });
  days.forEach(function(fecha){
    var vm = numVal('m-macro-'+fecha), vb = numVal('m-bombas-'+fecha);
    if(vm!=null || vb!=null || merged[fecha]){
      var base = merged[fecha] || { fecha:fecha };
      merged[fecha] = {
        fecha: fecha,
        macroLectura: vm!=null ? vm : (base.macroLectura!=null ? base.macroLectura : null),
        bombasLectura: vb!=null ? vb : (base.bombasLectura!=null ? base.bombasLectura : null)
      };
    }
  });
  var series = metersSeries(Object.keys(merged).map(function(k){ return merged[k]; }));
  var byFecha = {};
  series.forEach(function(s){ byFecha[s.fecha] = s; });

  var macroVals = [], bombasVals = [], manoVals = [], sciVals = [];
  days.forEach(function(fecha){
    var s = byFecha[fecha];
    var mc = document.getElementById('m-macro-consumo-'+fecha), bc = document.getElementById('m-bombas-consumo-'+fecha);
    if(mc) mc.innerHTML = consumoInnerHtml(s ? s.macroConsumo : null);
    if(bc) bc.innerHTML = consumoInnerHtml(s ? s.bombasConsumo : null);
    if(s && s.macroConsumo!=null) macroVals.push(s.macroConsumo);
    if(s && s.bombasConsumo!=null) bombasVals.push(s.bombasConsumo);
    var mano = numVal('m-mano-'+fecha), sci = numVal('m-sci-'+fecha);
    if(mano!=null) manoVals.push(mano);
    if(sci!=null) sciVals.push(sci);
  });
  setText('month-avg-macro', average(macroVals)!=null ? fmtNum(average(macroVals),2)+' m³' : '—');
  setText('month-avg-bombas', average(bombasVals)!=null ? fmtNum(average(bombasVals),2)+' m³' : '—');
  setText('month-avg-mano', average(manoVals)!=null ? fmtNum(average(manoVals),1)+' psi' : '—');
  setText('month-avg-sci', average(sciVals)!=null ? fmtNum(average(sciVals),1)+' psi' : '—');
}

function saveMonthGrid(){
  var piazza = ui.selectedPiazza, days = daysInMonthArr(ui.selectedMonth);
  var savedCount = 0, incompleteCount = 0, savedRecords = [];
  days.forEach(function(fecha){
    /* Bombas y manómetro son siempre opcionales (no todas las Piazzas los usan);
       solo la lectura macro y la presión SCI son obligatorias para guardar el día. */
    var macro = numVal('m-macro-'+fecha), bombas = numVal('m-bombas-'+fecha);
    var mano = numVal('m-mano-'+fecha), sci = numVal('m-sci-'+fecha);
    var obsEl = document.getElementById('m-obs-'+fecha);
    var obs = obsEl ? obsEl.value : '';
    var anyFilled = macro!=null || bombas!=null || mano!=null || sci!=null || (obs && obs.trim());
    if(!anyFilled) return;
    if(macro!=null && sci!=null){
      var rec = upsertByPiazzaFecha(piazza, fecha, { macroLectura:macro, bombasLectura:bombas, presionManometro:mano, presionSci:sci, observacion: obs||'' }, null);
      if(rec) savedRecords.push(rec);
      savedCount++;
    } else {
      incompleteCount++;
    }
  });
  if(savedCount===0){
    toast(incompleteCount ? ('Completa las lecturas de cada día antes de guardar (' + incompleteCount + ' día(s) incompletos).') : 'No hay cambios para guardar.', true);
    return;
  }
  renderSidebar();
  persist({ upserts: savedRecords });
  toast('Se guardaron ' + savedCount + ' día(s).' + (incompleteCount ? (' ' + incompleteCount + ' quedaron incompletos y no se guardaron.') : ''));
}

/* Preserve unsaved, incomplete typed cells across the reload a publish triggers. */
function stashRegistroDraftIfNeeded(){
  if(ui.view !== 'registro') return;
  if(!document.getElementById('month-grid')) return;
  try{
    var piazza = ui.selectedPiazza, month = ui.selectedMonth;
    var days = daysInMonthArr(month);
    var values = {};
    days.forEach(function(fecha){
      var v = {
        macroLectura: rawVal('m-macro-'+fecha), bombasLectura: rawVal('m-bombas-'+fecha),
        presionManometro: rawVal('m-mano-'+fecha), presionSci: rawVal('m-sci-'+fecha),
        observacion: rawVal('m-obs-'+fecha)
      };
      if(v.macroLectura || v.bombasLectura || v.presionManometro || v.presionSci || v.observacion) values[fecha] = v;
    });
    if(Object.keys(values).length){
      sessionStorage.setItem('registroDraft', JSON.stringify({ piazza:piazza, month:month, values:values }));
    } else {
      sessionStorage.removeItem('registroDraft');
    }
  }catch(e){}
}

function restoreRegistroDraftIfAny(){
  try{
    var raw = sessionStorage.getItem('registroDraft');
    if(!raw) return;
    var draft = JSON.parse(raw);
    if(!draft || draft.piazza !== ui.selectedPiazza || draft.month !== ui.selectedMonth) return;
    Object.keys(draft.values).forEach(function(fecha){
      var v = draft.values[fecha];
      setInputIfEmpty('m-macro-'+fecha, v.macroLectura);
      setInputIfEmpty('m-bombas-'+fecha, v.bombasLectura);
      setInputIfEmpty('m-mano-'+fecha, v.presionManometro);
      setInputIfEmpty('m-sci-'+fecha, v.presionSci);
      setInputIfEmpty('m-obs-'+fecha, v.observacion);
    });
    sessionStorage.removeItem('registroDraft');
    toast('Se recuperaron datos que no habías guardado.');
  }catch(e){}
}

function bindRowActions(scope){
  scope.querySelectorAll('[data-view]').forEach(function(el){ el.addEventListener('click', function(){ openViewModal(el.getAttribute('data-view')); }); });
  scope.querySelectorAll('[data-pdf]').forEach(function(el){ el.addEventListener('click', function(){ exportRecordPdf(el.getAttribute('data-pdf')); }); });
  scope.querySelectorAll('[data-edit]').forEach(function(el){ el.addEventListener('click', function(){ startEdit(el.getAttribute('data-edit')); }); });
  scope.querySelectorAll('[data-del]').forEach(function(el){ el.addEventListener('click', function(){ confirmDelete(el.getAttribute('data-del')); }); });
}

/* ============================= RENDER: PIAZZA DASHBOARD ============================= */

var PERIOD_COUNTS = { dia:14, semana:8, mes:6 };
var PERIOD_LABELS = { dia:'Día', semana:'Semana', mes:'Mes' };

function windowStartISO(period, count, anchor){
  var today = anchor || todayISO();
  if(period==='dia') return addDays(today, -(count-1));
  if(period==='semana') return addDays(today, -(count*7-1));
  var d = parseISODate(today); d.setDate(1); d.setMonth(d.getMonth()-(count-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}

/* Anchor date (end of the visible window). ui.periodAnchor is null while viewing the most
   recent window ("Hoy"); otherwise it's an explicit ISO date picked via ‹ › or the calendar jump. */
function currentAnchor(){
  var a = ui.periodAnchor || todayISO();
  return a > todayISO() ? todayISO() : a;
}

/* Move the anchor one whole window forward/back (dir = -1 or 1), by period size. */
function stepAnchor(period, anchor, dir){
  if(period==='dia') return addDays(anchor, dir*PERIOD_COUNTS.dia);
  if(period==='semana') return addDays(anchor, dir*PERIOD_COUNTS.semana*7);
  var d = parseISODate(anchor); d.setMonth(d.getMonth()+dir*PERIOD_COUNTS.mes);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function lastDayOfMonth(ym){
  var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
  var d = new Date(y, m, 0);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderPiazza(piazza){
  var main = document.getElementById('main');
  var records = recordsForPiazza(piazza);
  var series = metersSeries(records); // ascending, with macroConsumo/bombasConsumo
  var count = PERIOD_COUNTS[ui.period];
  var anchor = currentAnchor();
  var atPresent = anchor === todayISO();

  function toSum(b){ return Object.assign({}, b, { value: b.count ? b.sum : null }); }
  var macroBuckets = aggregate(series, ui.period, count, function(r){ return r.macroConsumo; }, anchor).map(toSum);
  var bombasBuckets = aggregate(series, ui.period, count, function(r){ return r.bombasConsumo; }, anchor).map(toSum);
  var sumaBuckets = aggregate(series, ui.period, count, function(r){
    if(r.macroConsumo==null && r.bombasConsumo==null) return null;
    return (r.macroConsumo||0) + (r.bombasConsumo||0);
  }, anchor).map(toSum);
  var showMano = hasManometro(piazza);
  var showBombas = hasSegundoMedidor(piazza);
  var manoBuckets = showMano ? aggregate(records, ui.period, count, function(r){ return Number(r.presionManometro); }, anchor) : [];
  var sciBuckets = aggregate(records, ui.period, count, function(r){ return Number(r.presionSci); }, anchor);

  var winStart = windowStartISO(ui.period, count, anchor);
  var winDaily = series.filter(function(r){ return r.fecha >= winStart && r.fecha <= anchor && (r.macroConsumo!=null || r.bombasConsumo!=null); })
    .map(function(r){ return (r.macroConsumo||0) + (r.bombasConsumo||0); });
  var sumaAvg = average(winDaily);
  var macroAvg = average(series.filter(function(r){ return r.fecha >= winStart && r.fecha <= anchor && r.macroConsumo!=null; })
    .map(function(r){ return r.macroConsumo; }));
  var bombasAvg = showBombas ? average(series.filter(function(r){ return r.fecha >= winStart && r.fecha <= anchor && r.bombasConsumo!=null; })
    .map(function(r){ return r.bombasConsumo; })) : null;
  var manoAvgHist = showMano ? average(records.map(function(r){ return Number(r.presionManometro); })) : null;
  var sciAvgHist = average(records.map(function(r){ return Number(r.presionSci); }));

  /* Average across the buckets currently on screen (respects the día/semana/mes toggle),
     shown on the needle gauge; manoAvgHist/sciAvgHist (all-time) sets the gauge's zone thresholds. */
  var manoPeriodAvg = showMano ? average(manoBuckets.map(function(b){ return b.value; })) : null;
  var sciPeriodAvg = average(sciBuckets.map(function(b){ return b.value; }));
  var manoPeriodObs = showMano ? [].concat.apply([], manoBuckets.map(function(b){ return b.obs; })) : [];
  var sciPeriodObs = [].concat.apply([], sciBuckets.map(function(b){ return b.obs; }));
  var periodAvgWord = { dia:'diario', semana:'semanal', mes:'mensual' }[ui.period];

  var rangeLabel = macroBuckets.length ? (macroBuckets[0].label + ' – ' + macroBuckets[macroBuckets.length-1].label) : '';

  main.innerHTML =
    '<div class="page-head">' +
      '<div><h1>' + escapeHtml(piazza) + '</h1><p class="page-sub">' + records.length + ' registro' + (records.length!==1?'s':'') + ' · vista por ' + PERIOD_LABELS[ui.period].toLowerCase() + '</p></div>' +
      '<div class="head-actions">' +
        '<div class="period-toggle" id="period-toggle">' +
          ['dia','semana','mes'].map(function(p){ return '<button data-p="'+p+'" class="'+(ui.period===p?'active':'')+'">'+PERIOD_LABELS[p]+'</button>'; }).join('') +
        '</div>' +
        '<div class="period-nav" style="display:flex; align-items:center; gap:6px;">' +
          '<button class="btn icon-btn btn-ghost" id="period-prev" title="Periodo anterior" aria-label="Periodo anterior">‹</button>' +
          '<span class="mono" style="font-size:12px; color:var(--muted); white-space:nowrap;">' + rangeLabel + '</span>' +
          '<button class="btn icon-btn btn-ghost" id="period-next" title="Periodo siguiente" aria-label="Periodo siguiente"' + (atPresent?' disabled':'') + '>›</button>' +
          (!atPresent ? '<button class="btn btn-sm" id="period-today">Hoy</button>' : '') +
          (ui.period==='mes'
            ? '<input type="month" id="period-jump" class="btn" title="Ir a un mes" style="padding:7px 10px;" max="'+todayISO().slice(0,7)+'" value="'+anchor.slice(0,7)+'">'
            : '<input type="date" id="period-jump" class="btn" title="Ir a una fecha" style="padding:7px 10px;" max="'+todayISO()+'" value="'+anchor+'">') +
        '</div>' +
        '<button class="btn no-print" id="export-dashboard-pdf">' + ICONS.download + ' Exportar PDF</button>' +
      '</div>' +
    '</div>' +
    '<div class="section-head"><h2>Consumo de agua</h2><p class="page-sub">m³ acumulados por periodo</p></div>' +
    '<div class="legend-row">' +
      legendChip('var(--accent)', 'Medidor macro') +
      (showBombas ? legendChip('var(--bombas)', segundoMedidorNombre(piazza)) : '') +
      (showBombas ? legendChip('var(--accent-deep)', 'Consumo total') : '') +
    '</div>' +
    '<div class="grid grid-2">' +
      chartCard('Medidor macro', 'm³ · total por periodo', 'macro-chart', 'var(--accent)') +
      statCard('Promedio diario — macro', macroAvg!=null?fmtNum(macroAvg,2)+' m³':'—', 'Consumo diario, medidor macro', 'var(--accent)') +
    '</div>' +
    (showBombas ?
    ('<div class="grid grid-2" style="margin-top:16px;">' +
      chartCard(segundoMedidorNombre(piazza), 'm³ · total por periodo', 'bombas-chart', 'var(--bombas)') +
      statCard('Promedio diario — ' + segundoMedidorCorto(piazza), bombasAvg!=null?fmtNum(bombasAvg,2)+' m³':'—', 'Consumo diario, ' + segundoMedidorFrase(piazza), 'var(--bombas)') +
    '</div>' +
    '<div class="grid grid-2" style="margin-top:16px;">' +
      chartCard('Consumo total (macro + ' + segundoMedidorFrase(piazza) + ')', 'm³ · total por periodo', 'suma-chart', 'var(--accent-deep)') +
      statCard('Promedio diario — total', sumaAvg!=null?fmtNum(sumaAvg,2)+' m³':'—', 'Consumo diario, macro + ' + segundoMedidorFrase(piazza), 'var(--accent-deep)') +
    '</div>')
    : '') +
    '<div class="section-head"><h2>Presión del sistema</h2><p class="page-sub">psi · valor por periodo y promedio</p></div>' +
    '<div class="legend-row">' +
      (showMano ? legendChip('var(--manometro)', 'Manómetro · agua potable') : '') +
      legendChip('var(--sci)', 'SCI · contra incendios') +
    '</div>' +
    (showMano ?
    ('<div class="grid grid-2" style="margin-top:0;">' +
      chartCard('Presión manómetro', 'psi · por periodo', 'mano-chart', 'var(--manometro)') +
      gaugeCard('Promedio ' + periodAvgWord + ' — manómetro', 'Cuarto de bombas · agua potable', 'mano-gauge', 'var(--manometro)') +
    '</div>') : '') +
    '<div class="grid grid-2" style="margin-top:16px;">' +
      chartCard('Presión SCI', 'psi · por periodo', 'sci-chart', 'var(--sci)') +
      gaugeCard('Promedio ' + periodAvgWord + ' — SCI', 'Sistema contra incendios', 'sci-gauge', 'var(--sci)') +
    '</div>' +
    '<div class="page-head" style="margin-top:26px;"><h2 style="font-size:16px;">Historial de ' + escapeHtml(piazza) + '</h2></div>' +
    '<div id="piazza-table"></div>';

  renderBarChart(document.getElementById('macro-chart'), macroBuckets, {color:'var(--accent)'});
  if(showBombas) renderBarChart(document.getElementById('bombas-chart'), bombasBuckets, {color:'var(--bombas)'});
  if(showBombas) renderBarChart(document.getElementById('suma-chart'), sumaBuckets, {color:'var(--accent-deep)'});
  if(showMano) renderBarChart(document.getElementById('mano-chart'), manoBuckets, {color:'var(--manometro)', unit:'psi'});
  renderBarChart(document.getElementById('sci-chart'), sciBuckets, {color:'var(--sci)', unit:'psi'});
  if(showMano) renderGauge(document.getElementById('mano-gauge'), { value: manoPeriodAvg, avg: manoAvgHist, obs: manoPeriodObs });
  renderGauge(document.getElementById('sci-gauge'), { value: sciPeriodAvg, avg: sciAvgHist, obs: sciPeriodObs });

  document.getElementById('period-toggle').querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){ ui.period = btn.getAttribute('data-p'); ui.periodAnchor = null; renderMain(); });
  });
  document.getElementById('period-prev').addEventListener('click', function(){
    ui.periodAnchor = stepAnchor(ui.period, currentAnchor(), -1);
    renderMain();
  });
  var nextBtn = document.getElementById('period-next');
  if(nextBtn) nextBtn.addEventListener('click', function(){
    var na = stepAnchor(ui.period, currentAnchor(), 1);
    ui.periodAnchor = (na >= todayISO()) ? null : na;
    renderMain();
  });
  var todayBtn = document.getElementById('period-today');
  if(todayBtn) todayBtn.addEventListener('click', function(){ ui.periodAnchor = null; renderMain(); });
  var jumpEl = document.getElementById('period-jump');
  if(jumpEl) jumpEl.addEventListener('change', function(e){
    var v = e.target.value;
    if(!v) return;
    var target = (ui.period==='mes') ? lastDayOfMonth(v) : v;
    if(target > todayISO()) target = todayISO();
    ui.periodAnchor = (target===todayISO()) ? null : target;
    renderMain();
  });
  document.getElementById('export-dashboard-pdf').addEventListener('click', exportDashboardPdf);

  renderPiazzaTable(piazza);

  function dot(color){ return color ? '<span class="metric-dot" style="background:'+color+';"></span>' : ''; }
  function chartCard(title, unit, id, color){
    return '<div class="card"'+(color?' style="border-top-color:'+color+';"':'')+'>' +
      '<div class="card-head"><span class="card-title">'+dot(color)+title+' <span class="unit">'+unit+'</span></span></div><div id="'+id+'"></div></div>';
  }
  function statCard(label, value, sub, color){
    return '<div class="card"'+(color?' style="border-top-color:'+color+';"':'')+'><div class="card-head"><span class="card-title">'+dot(color)+label+'</span></div>' +
      '<div class="stat-value mono">'+value+'</div><div class="stat-label">'+sub+'</div></div>';
  }
  function gaugeCard(title, sub, id, color){
    return '<div class="card gauge-card"'+(color?' style="border-top-color:'+color+';"':'')+'>' +
      '<div class="card-head" style="width:100%;"><span class="card-title">'+dot(color)+title+'</span></div>' +
      '<p class="page-sub" style="margin:-6px 0 4px;">'+sub+'</p><div id="'+id+'"></div></div>';
  }
  function legendChip(color, label){
    return '<span class="legend-chip"><span class="metric-dot" style="background:'+color+';"></span>'+escapeHtml(label)+'</span>';
  }
}

function renderPiazzaTable(piazza){
  var wrap = document.getElementById('piazza-table');
  var showMano = hasManometro(piazza);
  var showBombas = hasSegundoMedidor(piazza);
  var list = metersSeries(recordsForPiazza(piazza)).slice().reverse().slice(0,100);
  if(!list.length){
    wrap.innerHTML = '<div class="table-wrap"><table><tbody><tr class="empty-row"><td>Sin registros todavía para '+escapeHtml(piazza)+'.</td></tr></tbody></table></div>';
    return;
  }
  var rows = list.map(function(r){
    return '<tr>' +
      '<td>' + fmtDate(r.fecha) + '</td>' +
      '<td class="mono table-num">' + fmtNum(r.macroLectura,2) + '</td>' +
      consumoCell(r.macroConsumo) +
      (showBombas ? ('<td class="mono table-num">' + fmtNum(r.bombasLectura,2) + '</td>' + consumoCell(r.bombasConsumo)) : '') +
      (showMano ? ('<td class="mono table-num">' + fmtNum(r.presionManometro,1) + '</td>') : '') +
      '<td class="mono table-num">' + fmtNum(r.presionSci,1) + '</td>' +
      '<td class="obs-cell">' + (r.observacion ? '<span class="obs-flag" data-view="'+r.id+'">'+ICONS.note+'</span> ' + escapeHtml(r.observacion) : '—') + '</td>' +
      '<td><div class="row-actions">' +
        '<button class="btn icon-btn btn-ghost" data-view="'+r.id+'" title="Ver">'+ICONS.eye+'</button>' +
        '<button class="btn icon-btn btn-ghost" data-pdf="'+r.id+'" title="Exportar PDF">'+ICONS.download+'</button>' +
        '<button class="btn icon-btn btn-ghost" data-edit="'+r.id+'" title="Editar">'+ICONS.pencil+'</button>' +
        '<button class="btn icon-btn btn-ghost btn-danger" data-del="'+r.id+'" title="Eliminar">'+ICONS.trash+'</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
  wrap.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Lectura macro</th><th>Consumo macro</th>' + (showBombas?('<th>Lectura ' + segundoMedidorCorto(piazza) + '</th><th>Consumo ' + segundoMedidorCorto(piazza) + '</th>'):'') + (showMano?'<th>Manóm.</th>':'') + '<th>SCI</th><th>Observación</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  bindRowActions(wrap);
}

/* ============================= RENDER: MAIN ROUTER ============================= */

function renderMain(){
  stashRegistroDraftIfNeeded(); // preserve any unsaved grid cells before this view is torn down
  if(ui.view === 'registro') renderRegistro();
  else renderPiazza(ui.view);
}

function renderAll(){
  renderSidebar();
  renderMain();
}

/* ============================= PUBLIC (for inline handlers) ============================= */

window.AppUI = {
  closeModal: closeModal,
  openViewModal: openViewModal,
  startEdit: startEdit,
  confirmDelete: confirmDelete,
  deleteRecord: deleteRecord,
  exportRecordPdf: exportRecordPdf
};

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

renderAll();

})();
</script>
